name: remote_magic_git
description: "macOS Git client that drives git/glab/gh on a remote or local host without requiring a working-tree clone."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Deliberately no `version:`. The app's version comes from git — the newest
# v-tag reachable from HEAD plus the commits since it — stamped into the built
# bundle's Info.plist by macos/scripts/stamp_version.sh as the Runner target's
# last build phase. Bumping the version is `git tag v1.4.1`; nothing in the
# repo needs editing.
#
# A `version:` here would reach nothing: no macOS build setting reads Flutter's
# generated FLUTTER_BUILD_NAME/NUMBER, macOS is the only platform, there is no
# package_info_plus to surface it at runtime, and `publish_to: none` keeps it
# off pub.dev. What it would do is sit in the one file everyone opens, looking
# authoritative while drifting tags behind the truth — which is exactly the
# "stale hardcoded number that looks real" the stamp script exists to prevent.
# Flutter defaults the absent key to 1.0.0+1, and nothing consumes that either.

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Communication & Transport
  dartssh2: ^2.22.5

  # State Management & DI
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2

  # macOS Native & Desktop Customization (all Swift Package Manager-capable)
  macos_ui: ^2.2.2
  macos_window_utils: ^1.9.1
  window_manager: ^0.5.1

  # Native folder picker for local repositories — a Finder pick is what
  # grants the sandbox access in the first place, not just a UX nicety.
  file_selector: ^1.0.3

  # Drag-and-drop of OS files into the app (e.g. drop a tool tarball onto the
  # doctor panel to sideload it). A Finder drop counts as user-selection, so
  # it's covered by the same user-selected file entitlement — no new grant.
  desktop_drop: ^0.7.1

  # Storage
  shared_preferences: ^2.3.2

  # Secrets (SSH password/passphrase/token) in the macOS Keychain, with a 0600
  # dotfile fallback for unsigned builds. 10.x uses the SPM-capable darwin
  # backend (min macOS 10.14; project target is 10.15).
  flutter_secure_storage: ^10.3.1
  re_highlight: ^0.0.3
  flutter_markdown_plus: ^1.0.9
  flutter_html: ^3.0.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2

  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Deterministic virtual clock for testing timer/debounce logic.
  fake_async: ^1.3.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/MG-icon.png
    - assets/MG_icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

